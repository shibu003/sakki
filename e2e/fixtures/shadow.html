<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>住所</title></head>
<body><main><h1>住所の入力</h1><zip-field id="host" style="display:block;width:320px"></zip-field></main>
<script>
customElements.define('zip-field', class extends HTMLElement {
  constructor() {
    super();
