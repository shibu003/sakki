<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>ご要望</title>
<style>body{font-family:sans-serif;margin:0}main{padding:24px}#note{border:1px solid #999;min-height:48px;width:300px;margin-top:8px}button{display:block;margin-top:16px;font-size:16px}</style></head>
<body><main><h1>ご要望の入力</h1>
<!-- リッチエディタの形: 文字を打つ div が aria-labelledby に自分の id も入れる（中の文字 = 打った値） -->
<span id="nl">ご要望</span>
<div id="note" role="textbox" contenteditable="true" aria-labelledby="nl note"></div>
<button type="button" id="other">別の所</button>
</main></body></html>
