<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>さっきの自分</title>
<style>
  :root { color-scheme: light; font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  body { margin: 0; background: #f1f5f9; color: #0f172a; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 14px 6px; font-size: 13px; }
  #status { margin: 0; line-height: 1.5; }
  #stage { flex: 1; min-height: 0; margin: 0 8px; }
  canvas { display: block; width: 100%; height: 100%; border-radius: 6px; background: #f8fafc; }
  footer { padding: 8px 14px 12px; }
  button { font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 6px; border: 1px solid #94a3b8; background: #fff; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header><p id="status">読み込んでいます…</p></header>
  <div id="stage"><canvas id="c" aria-label="さっきの自分の再生"></canvas></div>
  <footer>
    <button id="again" hidden>もう一度</button>
    <button id="try" hidden>偽の手続きを開く</button>
  </footer>
  <script type="module" src="src/sidepanel.js"></script>
</body>
</html>
