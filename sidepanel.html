<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>さっきの自分</title>
<style>
  :root { color-scheme: light; font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  body { margin: 0; background: #f1f5f9; color: #0f172a; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 14px 6px; font-size: 13px; }
  #status { margin: 0; line-height: 1.5; }
  #stage { flex: 1; min-height: 0; margin: 0 8px; position: relative; overflow: hidden; border-radius: 6px; background: #f8fafc; }
  #page { position: absolute; left: 0; top: 0; border: 0; background: #fff; transform-origin: 0 0; pointer-events: none; }
  canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  footer { padding: 8px 14px 12px; }
  button { font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 6px; border: 1px solid #94a3b8; background: #fff; cursor: pointer; }
  #send { background: #4f46e5; border-color: #4f46e5; color: #fff; font-weight: 600; }
  #send:disabled { background: #e2e8f0; border-color: #cbd5e1; color: #475569; font-weight: 400; cursor: default; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header><p id="status">読み込んでいます…</p></header>
  <div id="stage"><iframe id="page" sandbox="" scrolling="no" tabindex="-1" aria-hidden="true" hidden></iframe><canvas id="c" aria-label="さっきの自分の再生"></canvas></div>
  <footer>
    <button id="send" hidden disabled>送る</button>
    <button id="again" hidden>もう一度</button>
    <button id="try" hidden>偽の手続きを開く</button>
  </footer>
  <script type="module" src="src/sidepanel.js"></script>
</body>
</html>
